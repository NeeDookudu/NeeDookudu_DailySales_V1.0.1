name: Hourly Collections Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      SUPER_KEY: ${{ secrets.SUPER_KEY }}
      ENC_KEY: ${{ secrets.ENC_KEY }}

    steps:
      # 1. Free up runner disk space
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      # 2. Sparse checkout to bypass downloading historical data files
      - name: Checkout repo (sparse)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            *.py
          sparse-checkout-cone-mode: false

      # 3. Setup Python without the pip cache dependency check
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright requests cryptography curl_cffi

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Create data directories
        run: |
          mkdir -p data encoded_data

      - name: 1. Run BMS Fetcher
        run: python BMSLIVERUN.py

      - name: 2. Run District Fetcher
        run: python DistrictLiveRun.py

      - name: 3. Run Merger
        run: python MergerRun.py

      - name: 4. Encrypt Merged Data
        run: python encryptor.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ encoded_data/

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update collections data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)
          else
            echo "No changes to commit"
          fi
